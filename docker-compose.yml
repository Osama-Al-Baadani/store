services:
  db:
    image: mysql:8.0
    container_name: store_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-store_db}
      MYSQL_USER: ${DB_USERNAME:-store_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-store_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-شركة المخازن الاقتصادية}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:u5m4yE2yD6xW0K2oJ4wS5lN7vQ9pA1zC3bF6hR8tU0k=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_TIMEZONE: Asia/Riyadh
      APP_LOCALE: ar
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-store_db}
      DB_USERNAME: ${DB_USERNAME:-store_user}
      DB_PASSWORD: ${DB_PASSWORD:-store_secret}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_uploads:/var/www/html/public/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-http://localhost:8000/storage}
    container_name: store_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-http://localhost:8000/storage}

volumes:
  db_data:
  backend_storage:
  backend_uploads:

